services:
  - type: web
    name: cc-settle-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run build && npx prisma migrate deploy
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false

[versions]
agp = "8.4.0"
kotlin = "2.0.0"
ksp = "2.0.0-1.0.21"
compose-bom = "2024.06.00"
room = "2.6.1"
workmanager = "2.9.0"
retrofit = "2.11.0"
okhttp = "4.12.0"
firebase-bom = "33.1.0"
navigation-compose = "2.8.0"
datastore = "1.1.1"
security-crypto = "1.1.0-alpha06"
lifecycle = "2.8.0"
activity-compose = "1.9.0"
coroutines = "1.8.1"
gson = "2.11.0"
google-services = "4.4.2"
play-services-auth = "21.2.0"

[libraries]
compose-bom                 = { group = "androidx.compose",            name = "compose-bom",                  version.ref = "compose-bom" }
compose-ui                  = { group = "androidx.compose.ui",         name = "ui" }
compose-ui-tooling          = { group = "androidx.compose.ui",         name = "ui-tooling-preview" }
compose-material3           = { group = "androidx.compose.material3",  name = "material3" }
compose-animation           = { group = "androidx.compose.animation",  name = "animation" }
compose-ui-text-google-fonts = { group = "androidx.compose.ui",       name = "ui-text-google-fonts" }
activity-compose            = { group = "androidx.activity",           name = "activity-compose",             version.ref = "activity-compose" }
navigation-compose          = { group = "androidx.navigation",         name = "navigation-compose",           version.ref = "navigation-compose" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle",          name = "lifecycle-viewmodel-compose",  version.ref = "lifecycle" }
lifecycle-runtime-compose   = { group = "androidx.lifecycle",          name = "lifecycle-runtime-compose",    version.ref = "lifecycle" }
room-runtime                = { group = "androidx.room",               name = "room-runtime",                 version.ref = "room" }
room-ktx                    = { group = "androidx.room",               name = "room-ktx",                    version.ref = "room" }
room-compiler               = { group = "androidx.room",               name = "room-compiler",                version.ref = "room" }
workmanager                 = { group = "androidx.work",               name = "work-runtime-ktx",             version.ref = "workmanager" }
retrofit                    = { group = "com.squareup.retrofit2",      name = "retrofit",                     version.ref = "retrofit" }
retrofit-gson               = { group = "com.squareup.retrofit2",      name = "converter-gson",               version.ref = "retrofit" }
okhttp-logging              = { group = "com.squareup.okhttp3",        name = "logging-interceptor",          version.ref = "okhttp" }
firebase-bom                = { group = "com.google.firebase",         name = "firebase-bom",                 version.ref = "firebase-bom" }
firebase-auth               = { group = "com.google.firebase",         name = "firebase-auth-ktx" }
firebase-messaging          = { group = "com.google.firebase",         name = "firebase-messaging-ktx" }
datastore-preferences       = { group = "androidx.datastore",          name = "datastore-preferences",        version.ref = "datastore" }
security-crypto             = { group = "androidx.security",           name = "security-crypto",              version.ref = "security-crypto" }
gson                        = { group = "com.google.code.gson",        name = "gson",                         version.ref = "gson" }
coroutines-android          = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-android",   version.ref = "coroutines" }
coroutines-play-services    = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }
junit                       = { group = "junit",                       name = "junit",                        version = "4.13.2" }
room-testing                = { group = "androidx.room",               name = "room-testing",                 version.ref = "room" }
workmanager-testing         = { group = "androidx.work",               name = "work-testing",                 version.ref = "workmanager" }
coroutines-test             = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-test",      version.ref = "coroutines" }
androidx-test-runner        = { group = "androidx.test",               name = "runner",                       version = "1.5.2" }
play-services-auth          = { group = "com.google.android.gms",      name = "play-services-auth",           version.ref = "play-services-auth" }

[plugins]
android-application = { id = "com.android.application",          version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",     version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp                 = { id = "com.google.devtools.ksp",          version.ref = "ksp" }
google-services     = { id = "com.google.gms.google-services",   version.ref = "google-services" }
